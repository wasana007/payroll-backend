server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.contracts.payroll"
        spring.json.value.default.type: com.contracts.payroll.v1.PayrollEvent
        max.poll.interval.ms: 300000
        max.poll.records: 1
        session.timeout.ms: 60000
        heartbeat.interval.ms: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  api:
    base-path: /api/v1/payroll
  kafka:
    topic:
      payroll: payroll-events
      payroll-log: payroll-log-events
    consumer:
      group-id: payroll-group
  version: 1.0.0